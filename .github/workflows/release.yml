name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  appimage:
    name: AppImage (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust araç zinciri
        uses: dtolnay/rust-toolchain@stable

      - name: Sistem bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl file libwayland-dev libxkbcommon-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev

      - name: Rust önbelleği
        uses: Swatinem/rust-cache@v2

      - name: Testler
        run: cargo test --all-targets

      - name: AppImage üret
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            ./scripts/package-appimage.sh "${GITHUB_REF_NAME#v}"
          else
            ./scripts/package-appimage.sh
          fi

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: Donustur-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Sürüm yayınla
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          generate_release_notes: true
